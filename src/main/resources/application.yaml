spring:
  application:
    name: breeze-core
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/breeze_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

breeze:
  clerk:
    issuer-uri: ${CLERK_ISSUER_URI}
    jwk-set-uri: ${CLERK_JWK_SET_URI}
    allowed-authorized-parties: ${CLERK_ALLOWED_AUTHORIZED_PARTIES}
